<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevOps Helpdesk</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <span class="eyebrow">DEVOPS HELPDESK</span>
        <h1>Ask your project docs.</h1>
        <p>Search the DevOps knowledge base and get answers with source references.</p>
      </header>

      <section class="chat-card" aria-label="Chat with the document assistant">
        <div id="messages" class="messages" aria-live="polite">
          <div class="message assistant">
            <span class="avatar">AI</span>
            <div class="bubble">Hello! Ask me about Docker, CI/CD, Kubernetes, Git, or troubleshooting.</div>
          </div>
        </div>

        <form id="chat-form" class="composer">
          <label for="question" class="sr-only">Your question</label>
          <textarea id="question" rows="2" placeholder="Ask a question about your documents..." required></textarea>
          <div class="composer-actions">
            <button id="send-button" type="submit">Send <span aria-hidden="true">↗</span></button>
          </div>
        </form>
        <p class="hint">Simple keyword RAG searches the project knowledge base and returns one focused source.</p>
      </section>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
